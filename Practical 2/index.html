<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Shopping Store</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>🛒 My Shopping Store</h1>

        <p>Quality Products At Best Price</p>

    </header>

    <!-- Customer Details -->

    <div class="customer">

        <h2>Customer Details</h2>

        <input type="text" id="name" placeholder="Enter Customer Name">

        <input type="text" id="phone" placeholder="Enter Phone Number">

        <input type="text" id="coupon" placeholder="Coupon Code (SAVE10)">

    </div>

    <!-- Products -->

    <div class="products">

        <!-- Shoes -->

        <div class="card">

            <img src="images/shoes.jpg">

            <h3>Sports Shoes</h3>

            <h2>₹1500</h2>

            Qty

            <input type="number" id="shoeQty" value="0" min="0">

        </div>

        <!-- Watch -->

        <div class="card">

            <img src="images/watch.jpg">

            <h3>Smart Watch</h3>

            <h2>₹2500</h2>

            Qty

            <input type="number" id="watchQty" value="0" min="0">

        </div>

        <!-- Headphones -->

        <div class="card">

            <img src="images/headphones.jpg">

            <h3>Headphones</h3>

            <h2>₹1200</h2>

            Qty

            <input type="number" id="headphoneQty" value="0" min="0">

        </div>

        <!-- Tshirt -->

        <div class="card">

            <img src="images/tshirt.jpg">

            <h3>T-Shirt</h3>

            <h2>₹800</h2>

            Qty

            <input type="number" id="shirtQty" value="0" min="0">

        </div>

        <!-- Handbag -->

        <div class="card">

            <img src="images/handbag.jpg">

            <h3>Hand Bag</h3>

            <h2>₹2200</h2>

            Qty

            <input type="number" id="bagQty" value="0" min="0">

        </div>

        <!-- Sunglasses -->

        <div class="card">

            <img src="images/sunglasses.jpg">

            <h3>Sunglasses</h3>

            <h2>₹900</h2>

            Qty

            <input type="number" id="glassQty" value="0" min="0">

        </div>

    </div>

    <div class="button">

        <button onclick="generateBill()">Generate Bill</button>

    </div>

    <!-- Bill -->

    <div id="bill"></div>

    <footer>

        Made By Sanskruti Asati | PRN - 24070521008

    </footer>

    <script src="script.js"></script>

</body>

</html>
