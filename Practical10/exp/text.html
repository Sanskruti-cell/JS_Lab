<!DOCTYPE html>
<html>
    <head>
        <title>Employee Details using JSON</title>
        <style>
            :root {
                color: #172033;
                background: #eef3f8;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            body {
                max-width: 960px;
                margin: 0 auto;
                padding: 40px 24px;
            }

            h2 {
                margin-bottom: 8px;
                color: #123c69;
            }

            h3 {
                margin: 28px 0 12px;
                color: #285f8f;
            }

            button {
                border: 0;
                border-radius: 6px;
                padding: 10px 16px;
                color: #ffffff;
                background: #176b87;
                font-size: 0.95rem;
                cursor: pointer;
            }

            button:hover {
                background: #10566d;
            }

            form {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
            }

            input {
                box-sizing: border-box;
                min-width: 160px;
                border: 1px solid #b7c5d1;
                border-radius: 6px;
                padding: 10px 12px;
                color: #172033;
                background: #ffffff;
                font-size: 0.95rem;
            }

            input:focus {
                outline: 3px solid #b8e1e8;
                border-color: #176b87;
            }

            #message {
                min-height: 20px;
                color: #176b87;
                font-weight: 600;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                overflow: hidden;
                border: 1px solid #c9d5df;
                border-radius: 8px;
                background: #ffffff;
                box-shadow: 0 8px 24px rgba(30, 57, 80, 0.08);
            }

            th,td{
                border-bottom: 1px solid #dbe3e9;
                padding: 10px;
                text-align: left;
            }

            th{
                color: #ffffff;
                background-color: #285f8f;
            }

            tbody tr:last-child td {
                border-bottom: 0;
            }

            tbody tr:hover {
                background: #f0f8fa;
            }

            @media (max-width: 600px) {
                body {
                    padding: 24px 14px;
                }

                input,
                form button {
                    width: 100%;
                }

                table {
                    font-size: 0.85rem;
                }

                th, td {
                    padding: 8px 6px;
                }
            }
        </style>
    
    </head>

    <body>
        <h2>Employee Details</h2>
        <button onclick="loadEmployees()">Load Employees</button>

        <h3>Add Employee</h3>
        <form id="employeeForm">
            <input type="number" id="employeeId" placeholder="Employee ID" min="1" required>
            <input type="text" id="employeeName" placeholder="Name" required>
            <input type="text" id="employeeDepartment" placeholder="Department" required>
            <input type="number" id="employeeSalary" placeholder="Salary" min="0" step="0.01" required>
            <button type="submit">Add Employee</button>
        </form>
        <p id="message"></p>

        <table id="employeeTable">
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Salary</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
                    </table>    
                
                    <script>
                        let employees = [];

                        function renderEmployees() {
                            let tableBody = document.querySelector("#employeeTable tbody");

                            tableBody.innerHTML = "";
                            employees.forEach(employee => {
                                let row = document.createElement("tr");

                                [employee.id, employee.name, employee.department, employee.salary]
                                    .forEach(value => {
                                        let cell = document.createElement("td");
                                        cell.textContent = value;
                                        row.appendChild(cell);
                                    });

                                tableBody.appendChild(row);
                            });
                        }

                        function loadEmployees() {
                            fetch("employees.json")
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error(`HTTP error: ${response.status}`);
                                    }

                                    return response.json();
                                })
                                .then(data => {
                                    employees = data;
                                    renderEmployees();
                                })
                                .catch(error => {
                                    console.error("Error loading employees:", error);
                                    document.querySelector("#employeeTable tbody").innerHTML =
                                        "<tr><td colspan=\"4\">Unable to load employee data.</td></tr>";
                                });
                        }

                        document.querySelector("#employeeForm").addEventListener("submit", function(event) {
                            event.preventDefault();

                            let newEmployee = {
                                id: Number(document.querySelector("#employeeId").value),
                                name: document.querySelector("#employeeName").value.trim(),
                                department: document.querySelector("#employeeDepartment").value.trim(),
                                salary: Number(document.querySelector("#employeeSalary").value)
                            };

                            employees.push(newEmployee);
                            renderEmployees();
                            this.reset();
                            document.querySelector("#message").textContent = "Employee added successfully.";
                        });
                    </script>
                
                
                </body>
                
</html>
